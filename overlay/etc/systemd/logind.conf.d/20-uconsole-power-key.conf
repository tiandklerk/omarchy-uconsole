# uConsole power button.
#
# The short press is handled in Hyprland (see /etc/skel/.config/hypr/
# bindings.lua) rather than here, because logind can lock a session but cannot
# blank the panel - and on a handheld the backlight is most of the idle draw.
# Leaving logind on `ignore` also avoids the key being handled twice.
#
# Note this is NOT suspend, because suspend does not exist on this hardware:
# Raspberry Pi builds bcm2712_defconfig without CONFIG_SUSPEND and
# CONFIG_HIBERNATION, so /sys/power/state is empty - no sleep state at all, not
# even s2idle. The session stays running; only the screen goes away.
[Login]
HandlePowerKey=ignore

# A long press still powers off, so the device is never stuck.
HandlePowerKeyLongPress=poweroff
